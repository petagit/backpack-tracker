<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .tabs {
            display: flex;
            gap: 5px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .tab {
            padding: 10px 25px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 6px 6px 0 0;
            font-size: 1em;
            transition: all 0.2s;
        }
        
        .tab:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .tab.active {
            background: white;
            color: #2d3748;
            font-weight: 600;
        }
        
        .summary {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .summary-item {
            text-align: center;
        }
        
        .summary-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .summary-value {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .controls {
            padding: 20px 30px;
            background: #f7fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        
        .filter-label {
            font-size: 0.9em;
            color: #4a5568;
            font-weight: 500;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
        }
        
        .btn-filter {
            padding: 8px 16px;
            background: #e2e8f0;
            color: #2d3748;
            font-size: 0.85em;
        }
        
        .btn-filter:hover {
            background: #cbd5e0;
        }
        
        .btn-filter.active {
            background: #667eea;
            color: white;
        }
        
        .table-container {
            padding: 30px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        
        th {
            background: #f7fafc;
            color: #2d3748;
            font-weight: 600;
            text-align: left;
            padding: 12px;
            position: sticky;
            top: 0;
            border-bottom: 2px solid #cbd5e0;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        tr:hover {
            background: #f7fafc;
        }
        
        tr.payment {
            background: #f0fff4;
        }
        
        tr.payment:hover {
            background: #e6ffed;
        }
        
        tr.shipping {
            background: #fffaf0;
        }
        
        tr.shipping:hover {
            background: #fef5e7;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 6px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-family: inherit;
            font-size: inherit;
        }
        
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        
        .edit-btn, .save-btn, .cancel-btn, .delete-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            transition: all 0.2s;
            margin-right: 5px;
        }
        
        .edit-btn {
            background: #667eea;
            color: white;
        }
        
        .edit-btn:hover {
            background: #5568d3;
        }
        
        .save-btn {
            background: #48bb78;
            color: white;
        }
        
        .save-btn:hover {
            background: #38a169;
        }
        
        .cancel-btn {
            background: #cbd5e0;
            color: #2d3748;
        }
        
        .cancel-btn:hover {
            background: #a0aec0;
        }
        
        .delete-btn {
            background: #f56565;
            color: white;
        }
        
        .delete-btn:hover {
            background: #e53e3e;
        }
        
        .success {
            background: #c6f6d5;
            color: #22543d;
            padding: 15px;
            margin: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .amount-positive {
            color: #c53030;
            font-weight: 500;
        }
        
        .amount-negative {
            color: #38a169;
            font-weight: 500;
        }
        
        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
        }
        
        .category-materials {
            background: #e6ffed;
            color: #22543d;
        }
        
        .category-shipping {
            background: #fef5e7;
            color: #744210;
        }
        
        .category-labor {
            background: #e0e7ff;
            color: #3730a3;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            max-width: 600px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 12px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        /* Gallery Styles */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 30px;
        }
        
        .gallery-item {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        
        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .gallery-item img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }
        
        .gallery-item-info {
            padding: 15px;
            background: #f7fafc;
        }
        
        .gallery-item-title {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .gallery-item-date {
            font-size: 0.85em;
            color: #718096;
        }
        
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 2001;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎒 Backpack Project Expense Tracker</h1>
            <div class="tabs">
                <button class="tab active" onclick="switchTab('expenses')">Expenses</button>
                <button class="tab" onclick="switchTab('gallery')">Gallery</button>
            </div>
            <div class="summary" id="summary">
                <div class="summary-item">
                    <div class="summary-label">Total Expenses (RMB)</div>
                    <div class="summary-value" id="totalRMB">¥0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Materials</div>
                    <div class="summary-value" id="materialsCost">¥0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Shipping</div>
                    <div class="summary-value" id="shippingCost">¥0</div>
                </div>
            </div>
        </header>
        
        <!-- Expenses Tab -->
        <div id="expenses-tab" class="tab-content active">
            <div class="controls">
                <button class="btn btn-primary" onclick="showAddModal()">+ Add Expense</button>
                <button class="btn btn-success" onclick="exportData()">📥 Export Data</button>
                <input type="file" id="importFile" style="display:none;" accept=".json" onchange="importData(event)">
                <button class="btn btn-primary" onclick="document.getElementById('importFile').click()">📤 Import Data</button>
                
                <div class="filter-group" style="margin-left: auto;">
                    <span class="filter-label">Filter:</span>
                    <button class="btn btn-filter active" data-filter="all" onclick="filterCategory('all')">All</button>
                    <button class="btn btn-filter" data-filter="Materials" onclick="filterCategory('Materials')">Materials</button>
                    <button class="btn btn-filter" data-filter="Shipping" onclick="filterCategory('Shipping')">Shipping</button>
                    <button class="btn btn-filter" data-filter="Labor" onclick="filterCategory('Labor')">Labor</button>
                </div>
            </div>
            
            <div class="table-container">
                <div id="successMsg" class="success" style="display:none;"></div>
                <table id="expenseTable">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Category</th>
                            <th>Amount (RMB)</th>
                            <th>Amount (USD)</th>
                            <th>Date</th>
                            <th>Notes</th>
                            <th>Payment Method</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expenseBody">
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Gallery Tab -->
        <div id="gallery-tab" class="tab-content">
            <div class="gallery-grid" id="galleryGrid">
                <!-- Gallery items will be inserted here -->
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Modal -->
    <div id="expenseModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Expense</h2>
            <form id="expenseForm" onsubmit="saveExpense(event)">
                <div class="form-group">
                    <label>Item *</label>
                    <input type="text" id="itemInput" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="categoryInput">
                        <option value="">None</option>
                        <option value="Materials">Materials</option>
                        <option value="Shipping">Shipping</option>
                        <option value="Labor">Labor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (RMB)</label>
                    <input type="text" id="rmbInput" placeholder="e.g., ¥43.00 or 43">
                </div>
                <div class="form-group">
                    <label>Amount (USD)</label>
                    <input type="text" id="usdInput" placeholder="e.g., $5.99 or 5.99">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="text" id="dateInput" placeholder="e.g., February 13, 2026">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notesInput" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <input type="text" id="paymentInput" placeholder="e.g., WeChat, Bank Transfer">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <input type="text" id="statusInput" placeholder="e.g., 交易成功">
                </div>
                <div style="margin-top: 20px; display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-success">Save</button>
                    <button type="button" class="btn cancel-btn" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImg" src="" alt="">
    </div>

        ];
        
        function loadData() {
            const saved = localStorage.getItem('backpackExpenses');
            if (saved) {
                expenses = JSON.parse(saved);
            } else {
                expenses = initialData;
                saveToLocalStorage();
            }
            renderTable();
            updateSummary();
        }
        
        function saveToLocalStorage() {
            localStorage.setItem('backpackExpenses', JSON.stringify(expenses));
        }
        
        function parseAmount(str) {
            if (!str) return 0;
            const cleaned = str.replace(/[$,¥]/g, '').replace(/"/g, '');
            return parseFloat(cleaned) || 0;
        }
        
        function formatAmount(amount, currency = 'RMB') {
            if (!amount && amount !== 0) return '';
            const symbol = currency === 'USD' ? '$' : '¥';
            const formatted = Math.abs(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            return amount < 0 ? `${symbol}-${formatted}` : `${symbol}${formatted}`;
        }
        
        function getCategoryClass(category) {
            if (!category) return '';
            return 'category-' + category.toLowerCase();
        }
        
        function updateSummary() {
            let totalRMB = 0;
            let materialsCost = 0;
            let shippingCost = 0;
            
            expenses.forEach(exp => {
                const rmb = parseAmount(exp['Amount(RMB)']);
                totalRMB += rmb;
                
                if (exp.Category === 'Materials') materialsCost += rmb;
                if (exp.Category === 'Shipping') shippingCost += rmb;
            });
            
            document.getElementById('totalRMB').textContent = formatAmount(totalRMB, 'RMB');
            document.getElementById('materialsCost').textContent = formatAmount(materialsCost, 'RMB');
            document.getElementById('shippingCost').textContent = formatAmount(shippingCost, 'RMB');
        }
        
        function renderTable() {
            const tbody = document.getElementById('expenseBody');
            tbody.innerHTML = '';
            
            const filteredExpenses = currentFilter === 'all' 
                ? expenses 
                : expenses.filter(exp => exp.Category === currentFilter);
            
            filteredExpenses.forEach((exp, index) => {
                if (!exp.Item && !exp['Amount(RMB)'] && !exp['Amount(USD)']) return;
                
                const actualIndex = expenses.indexOf(exp);
                const row = document.createElement('tr');
                const isPayment = exp.Item && exp.Item.toLowerCase().includes('paid');
                const isShipping = exp.Category === 'Shipping';
                
                if (isPayment) row.classList.add('payment');
                if (isShipping) row.classList.add('shipping');
                
                const rmbAmount = parseAmount(exp['Amount(RMB)']);
                const usdAmount = parseAmount(exp['Amount(USD)']);
                const rmbClass = rmbAmount < 0 ? 'amount-negative' : 'amount-positive';
                const usdClass = usdAmount < 0 ? 'amount-negative' : 'amount-positive';
                
                const categoryBadge = exp.Category 
                    ? `<span class="category-badge ${getCategoryClass(exp.Category)}">${exp.Category}</span>`
                    : '';
                
                row.innerHTML = `
                    <td>${exp.Item || ''}</td>
                    <td>${categoryBadge}</td>
                    <td class="${rmbClass}">${exp['Amount(RMB)'] || ''}</td>
                    <td class="${usdClass}">${exp['Amount(USD)'] || ''}</td>
                    <td>${exp.Date || ''}</td>
                    <td>${exp.Notes || ''}</td>
                    <td>${exp['Payment Method'] || ''}</td>
                    <td>${exp.Status || ''}</td>
                    <td>
                        <button class="edit-btn" onclick="editExpense(${actualIndex})">Edit</button>
                        <button class="delete-btn" onclick="deleteExpense(${actualIndex})">Delete</button>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        function filterCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.btn-filter').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filter === category) {
                    btn.classList.add('active');
                }
            });
            renderTable();
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
            
            if (tabName === 'gallery') {
                renderGallery();
            }
        }
        
        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            galleryImages.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openLightbox(img.src);
                item.innerHTML = `
                    <img src="${img.src}" alt="${img.title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22400%22%3E%3Crect fill=%22%23eee%22 width=%22300%22 height=%22400%22/%3E%3Ctext fill=%22%23999%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22%3EImage not found%3C/text%3E%3C/svg%3E'">
                    <div class="gallery-item-info">
                        <div class="gallery-item-title">${img.title}</div>
                        <div class="gallery-item-date">${img.date}</div>
                    </div>
                `;
                grid.appendChild(item);
            });
        }
        
        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('active');
        }
        
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }
        
        function showAddModal() {
            editingIndex = null;
            document.getElementById('modalTitle').textContent = 'Add Expense';
            document.getElementById('expenseForm').reset();
            document.getElementById('expenseModal').style.display = 'block';
        }
        
        function editExpense(index) {
            editingIndex = index;
            const exp = expenses[index];
            document.getElementById('modalTitle').textContent = 'Edit Expense';
            document.getElementById('itemInput').value = exp.Item || '';
            document.getElementById('categoryInput').value = exp.Category || '';
            document.getElementById('rmbInput').value = exp['Amount(RMB)'] || '';
            document.getElementById('usdInput').value = exp['Amount(USD)'] || '';
            document.getElementById('dateInput').value = exp.Date || '';
            document.getElementById('notesInput').value = exp.Notes || '';
            document.getElementById('paymentInput').value = exp['Payment Method'] || '';
            document.getElementById('statusInput').value = exp.Status || '';
            document.getElementById('expenseModal').style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('expenseModal').style.display = 'none';
            editingIndex = null;
        }
        
        function saveExpense(event) {
            event.preventDefault();
            
            const expense = {
                Item: document.getElementById('itemInput').value,
                Category: document.getElementById('categoryInput').value,
                'Amount(RMB)': document.getElementById('rmbInput').value,
                'Amount(USD)': document.getElementById('usdInput').value,
                Date: document.getElementById('dateInput').value,
                Notes: document.getElementById('notesInput').value,
                'Payment Method': document.getElementById('paymentInput').value,
                Receipt: '',
                Status: document.getElementById('statusInput').value
            };
            
            if (editingIndex !== null) {
                expenses[editingIndex] = expense;
            } else {
                expenses.push(expense);
            }
            
            saveToLocalStorage();
            renderTable();
            updateSummary();
            closeModal();
            showSuccess('Expense saved successfully!');
        }
        
        function deleteExpense(index) {
            if (confirm('Are you sure you want to delete this expense?')) {
                expenses.splice(index, 1);
                saveToLocalStorage();
                renderTable();
                updateSummary();
                showSuccess('Expense deleted successfully!');
            }
        }
        
        function exportData() {
            const dataStr = JSON.stringify(expenses, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `backpack-expenses-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            showSuccess('Data exported successfully!');
        }
        
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        expenses = imported;
                        saveToLocalStorage();
                        renderTable();
                        updateSummary();
                        showSuccess('Data imported successfully!');
                    } else {
                        alert('Invalid file format');
                    }
                } catch (error) {
                    alert('Error importing file: ' + error.message);
                }
            };
            reader.readAsText(file);
        }
        
        function showSuccess(message) {
            const el = document.getElementById('successMsg');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 3000);
        }
        
        // Load data on page load
        loadData();
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backpack Project Expense Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .summary {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .summary-item {
            text-align: center;
        }
        
        .summary-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .summary-value {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .controls {
            padding: 20px 30px;
            background: #f7fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
        }
        
        .table-container {
            padding: 30px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        
        th {
            background: #f7fafc;
            color: #2d3748;
            font-weight: 600;
            text-align: left;
            padding: 12px;
            position: sticky;
            top: 0;
            border-bottom: 2px solid #cbd5e0;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        tr:hover {
            background: #f7fafc;
        }
        
        tr.payment {
            background: #f0fff4;
        }
        
        tr.payment:hover {
            background: #e6ffed;
        }
        
        tr.editing {
            background: #fffaf0;
        }
        
        input, textarea {
            width: 100%;
            padding: 6px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-family: inherit;
            font-size: inherit;
        }
        
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        
        .edit-btn, .save-btn, .cancel-btn, .delete-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            transition: all 0.2s;
            margin-right: 5px;
        }
        
        .edit-btn {
            background: #667eea;
            color: white;
        }
        
        .edit-btn:hover {
            background: #5568d3;
        }
        
        .save-btn {
            background: #48bb78;
            color: white;
        }
        
        .save-btn:hover {
            background: #38a169;
        }
        
        .cancel-btn {
            background: #cbd5e0;
            color: #2d3748;
        }
        
        .cancel-btn:hover {
            background: #a0aec0;
        }
        
        .delete-btn {
            background: #f56565;
            color: white;
        }
        
        .delete-btn:hover {
            background: #e53e3e;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
            font-size: 1.1em;
        }
        
        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            margin: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .success {
            background: #c6f6d5;
            color: #22543d;
            padding: 15px;
            margin: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .amount-positive {
            color: #c53030;
            font-weight: 500;
        }
        
        .amount-negative {
            color: #38a169;
            font-weight: 500;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            max-width: 600px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 12px;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎒 Backpack Project Expense Tracker</h1>
            <div class="summary" id="summary">
                <div class="summary-item">
                    <div class="summary-label">Total Expenses (RMB)</div>
                    <div class="summary-value" id="totalRMB">¥0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Total Expenses (USD)</div>
                    <div class="summary-value" id="totalUSD">$0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Net Balance</div>
                    <div class="summary-value" id="netBalance">¥0</div>
                </div>
            </div>
        </header>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="showAddModal()">+ Add Expense</button>
            <button class="btn btn-success" onclick="exportData()">📥 Export Data</button>
            <input type="file" id="importFile" style="display:none;" accept=".json" onchange="importData(event)">
            <button class="btn btn-primary" onclick="document.getElementById('importFile').click()">📤 Import Data</button>
        </div>
        
        <div class="table-container">
            <div id="successMsg" class="success" style="display:none;"></div>
            <div id="errorMsg" class="error" style="display:none;"></div>
            <table id="expenseTable">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Amount (RMB)</th>
                        <th>Amount (USD)</th>
                        <th>Date</th>
                        <th>Notes</th>
                        <th>Payment Method</th>
                        <th>Receipt</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="expenseBody">
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Add/Edit Modal -->
    <div id="expenseModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Expense</h2>
            <form id="expenseForm" onsubmit="saveExpense(event)">
                <div class="form-group">
                    <label>Item *</label>
                    <input type="text" id="itemInput" required>
                </div>
                <div class="form-group">
                    <label>Amount (RMB)</label>
                    <input type="text" id="rmbInput" placeholder="e.g., $43.00 or 43">
                </div>
                <div class="form-group">
                    <label>Amount (USD)</label>
                    <input type="text" id="usdInput" placeholder="e.g., $5.99 or 5.99">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="text" id="dateInput" placeholder="e.g., February 13, 2026">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notesInput" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <input type="text" id="paymentInput" placeholder="e.g., WeChat, Bank Transfer">
                </div>
                <div class="form-group">
                    <label>Receipt URL</label>
                    <input type="text" id="receiptInput" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <input type="text" id="statusInput" placeholder="e.g., 交易成功">
                </div>
                <div style="margin-top: 20px; display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-success">Save</button>
                    <button type="button" class="btn cancel-btn" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

        function loadData() {
            const saved = localStorage.getItem('backpackExpenses');
            if (saved) {
                expenses = JSON.parse(saved);
            } else {
                expenses = initialData;
                saveToLocalStorage();
            }
            renderTable();
            updateSummary();
        }
        
        function saveToLocalStorage() {
            localStorage.setItem('backpackExpenses', JSON.stringify(expenses));
        }
        
        function parseAmount(str) {
            if (!str) return 0;
            const cleaned = str.replace(/[$,¥]/g, '').replace(/"/g, '');
            return parseFloat(cleaned) || 0;
        }
        
        function formatAmount(amount, currency = 'RMB') {
            if (!amount && amount !== 0) return '';
            const symbol = currency === 'USD' ? '$' : '¥';
            const formatted = Math.abs(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            return amount < 0 ? `${symbol}-${formatted}` : `${symbol}${formatted}`;
        }
        
        function updateSummary() {
            let totalRMB = 0;
            let totalUSD = 0;
            
            expenses.forEach(exp => {
                const rmb = parseAmount(exp['Amount(RMB)']);
                const usd = parseAmount(exp['Amount(USD)']);
                totalRMB += rmb;
                totalUSD += usd;
            });
            
            document.getElementById('totalRMB').textContent = formatAmount(totalRMB, 'RMB');
            document.getElementById('totalUSD').textContent = formatAmount(totalUSD, 'USD');
            document.getElementById('netBalance').textContent = formatAmount(totalRMB, 'RMB');
            
            const netBalanceEl = document.getElementById('netBalance');
            if (totalRMB < 0) {
                netBalanceEl.style.color = '#38a169';
            } else {
                netBalanceEl.style.color = '#c53030';
            }
        }
        
        function renderTable() {
            const tbody = document.getElementById('expenseBody');
            tbody.innerHTML = '';
            
            expenses.forEach((exp, index) => {
                if (!exp.Item && !exp['Amount(RMB)'] && !exp['Amount(USD)']) return; // Skip empty rows
                
                const row = document.createElement('tr');
                const isPayment = exp.Item && exp.Item.toLowerCase().includes('paid');
                
                if (isPayment) {
                    row.classList.add('payment');
                }
                
                const rmbAmount = parseAmount(exp['Amount(RMB)']);
                const usdAmount = parseAmount(exp['Amount(USD)']);
                const rmbClass = rmbAmount < 0 ? 'amount-negative' : 'amount-positive';
                const usdClass = usdAmount < 0 ? 'amount-negative' : 'amount-positive';
                
                row.innerHTML = `
                    <td>${exp.Item || ''}</td>
                    <td class="${rmbClass}">${exp['Amount(RMB)'] || ''}</td>
                    <td class="${usdClass}">${exp['Amount(USD)'] || ''}</td>
                    <td>${exp.Date || ''}</td>
                    <td>${exp.Notes || ''}</td>
                    <td>${exp['Payment Method'] || ''}</td>
                    <td>${exp.Receipt ? `<a href="${exp.Receipt}" target="_blank">View</a>` : ''}</td>
                    <td>${exp.Status || ''}</td>
                    <td>
                        <button class="edit-btn" onclick="editExpense(${index})">Edit</button>
                        <button class="delete-btn" onclick="deleteExpense(${index})">Delete</button>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        function showAddModal() {
            editingIndex = null;
            document.getElementById('modalTitle').textContent = 'Add Expense';
            document.getElementById('expenseForm').reset();
            document.getElementById('expenseModal').style.display = 'block';
        }
        
        function editExpense(index) {
            editingIndex = index;
            const exp = expenses[index];
            document.getElementById('modalTitle').textContent = 'Edit Expense';
            document.getElementById('itemInput').value = exp.Item || '';
            document.getElementById('rmbInput').value = exp['Amount(RMB)'] || '';
            document.getElementById('usdInput').value = exp['Amount(USD)'] || '';
            document.getElementById('dateInput').value = exp.Date || '';
            document.getElementById('notesInput').value = exp.Notes || '';
            document.getElementById('paymentInput').value = exp['Payment Method'] || '';
            document.getElementById('receiptInput').value = exp.Receipt || '';
            document.getElementById('statusInput').value = exp.Status || '';
            document.getElementById('expenseModal').style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('expenseModal').style.display = 'none';
            editingIndex = null;
        }
        
        function saveExpense(event) {
            event.preventDefault();
            
            const expense = {
                Item: document.getElementById('itemInput').value,
                'Amount(RMB)': document.getElementById('rmbInput').value,
                'Amount(USD)': document.getElementById('usdInput').value,
                Date: document.getElementById('dateInput').value,
                Notes: document.getElementById('notesInput').value,
                'Payment Method': document.getElementById('paymentInput').value,
                Receipt: document.getElementById('receiptInput').value,
                Status: document.getElementById('statusInput').value
            };
            
            if (editingIndex !== null) {
                expenses[editingIndex] = expense;
            } else {
                expenses.push(expense);
            }
            
            saveToLocalStorage();
            renderTable();
            updateSummary();
            closeModal();
            showSuccess('Expense saved successfully!');
        }
        
        function deleteExpense(index) {
            if (confirm('Are you sure you want to delete this expense?')) {
                expenses.splice(index, 1);
                saveToLocalStorage();
                renderTable();
                updateSummary();
                showSuccess('Expense deleted successfully!');
            }
        }
        
        function exportData() {
            const dataStr = JSON.stringify(expenses, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `backpack-expenses-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            showSuccess('Data exported successfully!');
        }
        
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        expenses = imported;
                        saveToLocalStorage();
                        renderTable();
                        updateSummary();
                        showSuccess('Data imported successfully!');
                    } else {
                        showError('Invalid file format');
                    }
                } catch (error) {
                    showError('Error importing file: ' + error.message);
                }
            };
            reader.readAsText(file);
        }
        
        function showSuccess(message) {
            const el = document.getElementById('successMsg');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 3000);
        }
        
        function showError(message) {
            const el = document.getElementById('errorMsg');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 5000);
        }
        
        // Load data on page load
        loadData();
    </script>
</body>
</html>
